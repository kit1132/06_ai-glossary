# Routines の正本経路。クラウドは claude/ にだけ push できる。
# この workflow が main へマージする。誤った用語更新も本番に乗る。
name: claude-branch-to-main

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

concurrency:
  group: claude-to-main
  cancel-in-progress: false

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: claude ブランチを main にマージ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "merging ${GITHUB_REF_NAME} into main"
          git merge --ff-only "origin/${GITHUB_REF_NAME}" || git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main

      - name: マージ済みブランチを削除
        run: git push origin --delete "${GITHUB_REF_NAME}" || true
